<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Payment — Knooz ERP</title>
<style>
body{font-family:system-ui,sans-serif;background:#f9fafb;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.card{background:white;border-radius:16px;padding:48px;text-align:center;max-width:480px;width:90%;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:32px}
.success{background:#f0fdf4}.error{background:#fef2f2}
h2{font-size:22px;font-weight:800;margin-bottom:8px}
p{color:#6b7280;font-size:14px;line-height:1.6;margin-bottom:24px}
.btn{display:inline-flex;align-items:center;background:#2563eb;color:white;font-weight:600;font-size:14px;padding:12px 24px;border-radius:10px;text-decoration:none;border:none;cursor:pointer}
.spinner{width:40px;height:40px;border:4px solid #e5e7eb;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="spinner"></div>
  <h2>Verifying Payment...</h2>
  <p>Please wait while we confirm your payment.</p>
</div>
<script>
const API = "https://erp.tcv-ai.com";
const params = new URLSearchParams(window.location.search);
const paymentId = params.get("id");
const status = params.get("status");
const slug = params.get("slug");
const plan = params.get("plan");

async function verify() {
  const card = document.getElementById("card");
  
  if(status === "paid" && paymentId) {
    try {
      const r = await fetch(`${API}/api/payments/verify/${paymentId}?slug=${slug}&plan=${plan}`);
      const d = await r.json();
      
      if(d.status === "success") {
        card.innerHTML = `
          <div class="icon success">✅</div>
          <h2>Payment Successful!</h2>
          <p>Your <strong>${plan}</strong> plan is now active. Welcome to Knooz ERP!</p>
          <a class="btn" href="/login?tenant=${slug}">Go to Login →</a>`;
      } else {
        card.innerHTML = `
          <div class="icon error">❌</div>
          <h2>Payment Issue</h2>
          <p>We could not verify your payment. Please contact support.</p>
          <a class="btn" href="/signup">Try Again</a>`;
      }
    } catch(e) {
      card.innerHTML = `
        <div class="icon error">❌</div>
        <h2>Verification Error</h2>
        <p>Could not connect to server. Please contact support@tcv-ai.com</p>
        <a class="btn" href="/signup">Try Again</a>`;
    }
  } else if(status === "failed") {
    card.innerHTML = `
      <div class="icon error">❌</div>
      <h2>Payment Failed</h2>
      <p>Your payment was not completed. Please try again with a different card.</p>
      <a class="btn" href="/signup">Try Again</a>`;
  } else {
    card.innerHTML = `
      <div class="icon error">⚠️</div>
      <h2>Unknown Status</h2>
      <p>Payment status unclear. Please contact support@tcv-ai.com</p>
      <a class="btn" href="/">Go Home</a>`;
  }
}

verify();
</script>
</body>
</html>
